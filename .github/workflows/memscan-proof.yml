# One-off: build and test the touched packages on all three OSes. Deleted before merge.
name: memscan-proof
on:
  push:
    branches: [fix/memscan-amd64]
jobs:
  t:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - shell: bash
        run: go test -race -count=1 -coverprofile=cover.out ./internal/prekey ./internal/receive ./internal/acceptance
      - shell: bash
        run: go tool cover -func=cover.out | grep -E "internal/(prekey|receive)/" | grep -v "100.0%" || echo "tier 1 packages at 100%"
