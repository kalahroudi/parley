# Temporary: memscan investigation on amd64 Linux. Deleted before merge.
name: memscan-proof
on:
  push:
    branches: [fix/memscan-amd64]
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scrub: ["on", "off"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: loop
        env:
          PARLEY_SCAN_DEBUG: "1"
        run: |
          [ "${{ matrix.scrub }}" = off ] && export PARLEY_NOSCRUB=1
          go test -race -c -o /tmp/acc ./internal/acceptance
          cd internal/acceptance
          fail=0
          for i in $(seq 1 60); do
            if ! /tmp/acc -test.count=1 -test.run '^TestAddressSpaceHoldsNoErasedKey$' -test.v > /tmp/o.$i 2>&1; then
              fail=$((fail+1)); echo "=== RUN $i FAILED"
              if [ $fail -le 2 ]; then cat /tmp/o.$i; else grep -E "hits map|copies" /tmp/o.$i | tail -6; fi
            fi
          done
          echo "scrub=${{ matrix.scrub }} $(uname -m): $fail failures of 60"
