# Temporary: loops the address-space scan on amd64 Linux, default and with async preemption off.
name: memscan-debug
on:
  push:
    branches: [fix/memscan-amd64]
  workflow_dispatch:
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [default, asyncpreemptoff]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: uname -m
      - name: loop
        env:
          PARLEY_SCAN_DEBUG: "1"
        run: |
          [ "${{ matrix.mode }}" = asyncpreemptoff ] && export GODEBUG=asyncpreemptoff=1
          go test -race -c -o /tmp/acc ./internal/acceptance
          cd internal/acceptance
          fail=0
          for i in $(seq 1 100); do
            if ! /tmp/acc -test.count=1 -test.run '^TestAddressSpaceHoldsNoErasedKey$' -test.v > /tmp/o.$i 2>&1; then fail=$((fail+1)); echo "=== RUN $i FAILED"; grep -E "CLASS|hits map|copies" /tmp/o.$i | tail -12; fi
          done
          echo "mode ${{ matrix.mode }} failures: $fail of 100"
