name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The minisign interoperability test skips when minisign is missing, so
      # install it where a package is available (Windows skips that test).
      - name: Install minisign
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y minisign; else brew install minisign; fi
      # Run Go directly, not through the Makefile Go target, which skips silently
      # when Go is missing and could let CI pass without running Go tests.
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test -race ./...
      - name: Gateway install
        working-directory: gateway
        run: npm ci
      - name: Gateway typecheck
        working-directory: gateway
        run: npm run typecheck
      - name: Gateway tests
        working-directory: gateway
        run: npm test
      # The soak is run alone, not beside the other test files: it does ~20k durable
      # storage writes, which cost ~25ms each on Windows runners (vs ~0.5ms on Linux and
      # macOS), so beside other files it starves them; its own timeouts are sized for that.
      - name: Gateway soak (T108)
        working-directory: gateway
        run: npm run test:soak
      - name: Layout tests
        run: node --test "tests/**/*.test.mjs"
