name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The minisign interoperability test skips when minisign is missing, so
      # install it where a package is available (Windows skips that test).
      - name: Install minisign
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y minisign; else brew install minisign; fi
      # Run Go directly, not through the Makefile Go target, which skips silently
      # when Go is missing and could let CI pass without running Go tests.
      - name: Go vet
        run: go vet ./...
      # Tier 1 at 100%, tier 2 at 95%, tier 3 at 85% (tests/coverage/tiers.json); CI
      # fails if any package falls below its tier. Go reports statements, not branches.
      - name: Go test with coverage
        shell: bash # PowerShell splits -coverprofile=cover.out at the dot
        run: go test -race -coverprofile=cover.out ./...
      - name: Go coverage gates
        run: go run ./scripts/covergate -profile cover.out
      # Tier 1 (plan.md, coverage policy): the envelope crypto module must stay at
      # 100% of statements; the fuzz step is a short smoke run over the committed
      # seed corpus (internal/envelope/testdata/fuzz).
      - name: Envelope coverage gate (tier 1)
        shell: bash
        run: |
          go test -coverprofile=envelope.cover ./internal/envelope
          pct=$(go tool cover -func=envelope.cover | awk '/^total:/ {print $3}')
          echo "envelope coverage: $pct"
          [ "$pct" = "100.0%" ]
      - name: Envelope fuzz smoke
        run: go test ./internal/envelope -run '^$' -fuzz FuzzMessage -fuzztime 20s
      - name: Envelope fuzz smoke (padding)
        run: go test ./internal/envelope -run '^$' -fuzz FuzzUnpad -fuzztime 10s
      - name: Envelope fuzz smoke (files)
        run: go test ./internal/envelope -run '^$' -fuzz FuzzDecryptFile -fuzztime 10s
      - name: Gateway install
        working-directory: gateway
        run: npm ci
      - name: Gateway typecheck
        working-directory: gateway
        run: npm run typecheck
      - name: Gateway tests with coverage gates
        working-directory: gateway
        run: npm run test:coverage
      - name: OIDC coverage gates
        working-directory: gateway
        run: npm run test:oidc-coverage
      # The soak is run alone, not beside the other test files: it does ~20k durable
      # storage writes, which cost ~25ms each on Windows runners (vs ~0.5ms on Linux and
      # macOS), so beside other files it starves them; its own timeouts are sized for that.
      - name: Gateway soak (T108)
        working-directory: gateway
        run: npm run test:soak
      - name: Layout tests
        run: node --test "tests/**/*.test.mjs"
      # Slow and Linux-only: mutation testing of the tier 1 packages.
      - name: Mutation testing (tier 1)
        if: runner.os == 'Linux'
        run: scripts/mutation.sh
      # Slow and Linux-only: each defence the malicious-gateway and prekey crash
      # tests exercise is removed in turn and the acceptance suite must go red.
      - name: Mutation testing (malicious gateway and prekey crash points)
        if: runner.os == 'Linux'
        run: scripts/malgw-mutations.sh
