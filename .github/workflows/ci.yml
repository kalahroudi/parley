name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A workflow file that does not parse or uses a context where it is not allowed only fails once
  # pushed (the run dies at 0 s), so check every workflow here. The binary is pinned and
  # its checksum (from the release's actionlint_1.7.7_checksums.txt) verified before it runs.
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        shell: bash
        run: |
          set -eu
          v=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL -o "$RUNNER_TEMP/al.tgz" "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sha  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Full history: the changed-code mutation run and the vector-lock check diff against the
      # base branch, which needs a merge base (a shallow checkout has none).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The minisign interoperability test skips when minisign is missing, so
      # install it where a package is available (Windows skips that test).
      - name: Install minisign
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y minisign; else brew install minisign; fi
      # The Linux sandbox profile (docs/sandbox/linux-bwrap.sh) is run against a live daemon; the test fails under CI if
      # bubblewrap cannot start. Ubuntu 24.04 blocks unprivileged user namespaces by default, so allow them here.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Run Go directly, not through the Makefile Go target, which skips silently
      # when Go is missing and could let CI pass without running Go tests.
      - name: Go vet
        run: go vet ./...
      # Tier 1 at 100%, tier 2 at 95%, tier 3 at 85% (tests/coverage/tiers.json); CI
      # fails if any package falls below its tier. Go reports statements, not branches.
      - name: Go test with coverage
        shell: bash # PowerShell splits -coverprofile=cover.out at the dot
        run: go test -race -coverprofile=cover.out ./...
      - name: Go coverage gates
        run: go run ./scripts/covergate -profile cover.out
      # Say whether each OS sandbox profile ran or was skipped, and fail if the profile of this OS did not run.
      - name: OS sandbox profiles (ran or skipped)
        shell: bash
        run: |
          go test -count=1 -v -run 'TestLinuxSandboxScriptKeeps|TestMacOSProfileKeeps|TestWindowsSandboxScriptParses' ./internal/acceptance | tee sandbox.out
          case "$RUNNER_OS" in Linux) k=linux;; macOS) k=macos;; *) k=windows;; esac
          grep -q "SANDBOX-PROFILE $k: " sandbox.out && ! grep -q "SANDBOX-PROFILE $k: SKIPPED" sandbox.out
      # Tier 1 (plan.md, coverage policy): the envelope crypto module must stay at
      # 100% of statements; the fuzz step is a short smoke run over the committed
      # seed corpus (internal/envelope/testdata/fuzz).
      - name: Envelope coverage gate (tier 1)
        shell: bash
        run: |
          go test -coverprofile=envelope.cover ./internal/envelope
          pct=$(go tool cover -func=envelope.cover | awk '/^total:/ {print $3}')
          echo "envelope coverage: $pct"
          [ "$pct" = "100.0%" ]
      # Every fuzz target (scripts/fuzz-targets.txt) for a few seconds over its
      # committed seed corpus; the long run is make fuzz-long and the weekly
      # "Fuzz (long)" workflow.
      - name: Fuzz smoke (all targets)
        run: node scripts/fuzz.mjs smoke
      # The published vectors checked by code that shares nothing with the Go
      # package (messages, padding, file chunks, bindings), and the vector lock.
      - name: Test vectors (independent Python verifier)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          if [ -d "$RUNNER_TEMP/v/Scripts" ]; then py="$RUNNER_TEMP/v/Scripts/python"; else py="$RUNNER_TEMP/v/bin/python"; fi
          "$py" -m pip install --quiet cryptography
          "$py" -I internal/envelope/testdata/verify_vectors.py
          echo "PARLEY_PYTHON=$py" >> "$GITHUB_ENV"
      # A vector file that changed since the base branch must carry a higher
      # version in its vectors.lock.json.
      - name: Test vector version bump
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          node scripts/vectorlock.mjs base "origin/$BASE"
      - name: Gateway install
        working-directory: gateway
        run: npm ci
      - name: Gateway typecheck
        working-directory: gateway
        run: npm run typecheck
      - name: Gateway tests with coverage gates
        working-directory: gateway
        run: npm run test:coverage
      - name: OIDC coverage gates
        working-directory: gateway
        run: npm run test:oidc-coverage
      # The soak is run alone, not beside the other test files: it does ~20k durable
      # storage writes, which cost ~25ms each on Windows runners (vs ~0.5ms on Linux and
      # macOS), so beside other files it starves them; its own timeouts are sized for that.
      - name: Gateway soak (T108)
        working-directory: gateway
        run: npm run test:soak
      # No development auth may ship (also run by the Release workflow).
      - name: Release gate (no development auth)
        run: node scripts/check-dev-auth.mjs
      - name: Layout tests
        run: node --test "tests/**/*.test.mjs"

  # Mutation testing is slow, so each part is a job of its own, running in parallel with the tests and with each other, each
  # with its own time limit (one job holding all three ran into the 90 minute limit of a job). Together they judge exactly
  # what the single Ubuntu job did, and the ownership rules of scripts/mutation-scope.mjs and scripts/mutation-gate.mjs are unchanged: every Go
  # file is judged on the runner that owns it, TypeScript and the crash-point mutants are Linux's, and a pull request
  # mutates only the tier 1 packages and files it changes. The full run, which also fails on a stale allowlist entry,
  # is mutation.yml, on every push to main and nightly. Job names (for the required checks):
  #   workflow lint, test (ubuntu-latest), test (macos-latest), test (windows-latest),
  #   mutation: changed code (linux, go-01) .. (linux, go-12), mutation: changed code (linux, typescript), mutation: this OS's Go files (macos-latest), mutation: this OS's Go files (windows-latest),
  #   mutation: crash points (linux)
  # and one stable name that covers them all: all-mutation-gates (require that one, not the list above, which changes
  # whenever the split changes).
  mutation-changed:
    name: "mutation: changed code (linux, ${{ matrix.label }})"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One job over all the changed tier 1 code died on its runner after 46 minutes whenever the whole of tier 1 was in scope
    # (a change to the mutation gates or this file puts it all in scope; the nightly full run on main dies the same way),
    # so the work is split: the Go packages into twelve jobs by position in the selected list (so that a package that kills its runner
    # shows up alone), and the TypeScript files into one. scripts/mutation-scope.mjs gives each its share (MUTATION_PART); together they are exactly what one job did.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: go-01, part: "go:0/12" }
          - { label: go-02, part: "go:1/12" }
          - { label: go-03, part: "go:2/12" }
          - { label: go-04, part: "go:3/12" }
          - { label: go-05, part: "go:4/12" }
          - { label: go-06, part: "go:5/12" }
          - { label: go-07, part: "go:6/12" }
          - { label: go-08, part: "go:7/12" }
          - { label: go-09, part: "go:8/12" }
          - { label: go-10, part: "go:9/12" }
          - { label: go-11, part: "go:10/12" }
          - { label: go-12, part: "go:11/12" }
          - { label: typescript, part: "ts" }
    steps:
      # Full history: the scope is the files changed since the merge base with the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gateway install
        working-directory: gateway
        run: npm ci
      # The history is already complete; this makes sure origin/<base> exists as a ref. If the merge base
      # still cannot be computed, scripts/mutation.sh runs everything instead of skipping.
      - name: Fetch the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
      - name: Mutation testing (tier 1, changed code)
        env:
          MUTATION_SCOPE: changed
          MUTATION_PART: ${{ matrix.part }}
          BASE: origin/${{ github.base_ref }}
        run: scripts/mutation.sh

  # Each OS judges the Go files only it builds (lock_windows.go on Windows, and so on): gremlins parses every file, so on
  # the wrong OS they only show as "not covered". The gate keeps failing on any not-covered or surviving mutant there
  # (scripts/mutation-gate.mjs). TypeScript is Linux's (the job above).
  mutation-os:
    name: "mutation: this OS's Go files (${{ matrix.os }})"
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
      - name: Mutation testing (tier 1, this OS's Go files)
        env:
          MUTATION_SCOPE: changed
          BASE: origin/${{ github.base_ref }}
          MUTATION_TS: "0"
        run: scripts/mutation.sh

  # Linux only: each defence the malicious-gateway and prekey crash tests exercise is removed in turn and the acceptance
  # suite must go red. It runs on every push and pull request, as before.
  mutation-crash-points:
    name: "mutation: crash points (linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Mutation testing (malicious gateway and prekey crash points)
        run: scripts/malgw-mutations.sh

  # One required check for every mutation job. It fails when a needed job failed, was cancelled or was skipped where it
  # must have run (a skipped job counts as passing for a required check, which would silently drop a gate): on a pull
  # request all three must succeed; on a push to main only the crash points run, the changed-code jobs are skipped.
  all-mutation-gates:
    name: all-mutation-gates
    if: always()
    needs: [mutation-changed, mutation-os, mutation-crash-points]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every mutation job ran and passed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ needs.mutation-changed.result }}
          OS: ${{ needs.mutation-os.result }}
          CRASH: ${{ needs.mutation-crash-points.result }}
        run: |
          set -eu
          echo "event=$EVENT changed=$CHANGED os=$OS crash=$CRASH"
          want_changed=success
          [ "$EVENT" = pull_request ] || want_changed=skipped
          [ "$CRASH" = success ] && [ "$CHANGED" = "$want_changed" ] && [ "$OS" = "$want_changed" ]
